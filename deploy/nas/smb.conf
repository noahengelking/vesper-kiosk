[global]
   server role = standalone server
   server string = Vesper NAS
   workgroup = WORKGROUP
   server min protocol = SMB3
   server max protocol = SMB3
   disable netbios = yes
   smb ports = 445
   map to guest = never
   usershare allow guests = no
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   unix extensions = no
   ea support = yes
   store dos attributes = yes
   vfs objects = fruit streams_xattr
   fruit:aapl = yes
   fruit:nfs_aces = no
   fruit:copyfile = yes
   fruit:model = MacSamba
   fruit:metadata = stream
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   hosts allow = 127.0.0.1 192.168.0.0/24 fe80::/10

[VesperTimeMachine]
   path = /srv/vesper/time-machine
   browseable = yes
   available = yes
   read only = no
   valid users = vesper
   force user = vesper
   force group = vesper
   create mask = 0660
   directory mask = 0770
   vfs objects = fruit streams_xattr
   fruit:time machine = yes
   fruit:time machine max size = 800G
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[VesperFiles]
   path = /srv/vesper/files
   browseable = yes
   available = yes
   read only = no
   valid users = vesper
   force user = vesper
   force group = vesper
   create mask = 0660
   directory mask = 0770
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
